[package]
name = "__CRATE_NAME__"
version = "__PLUGIN_VERSION__"
edition = "2021"
description = "__PLUGIN_NAME__ — CPP-v1 external-process 插件（echo 工具 + workspace.panel 面板）"
publish = false
license = "MIT"

# `[workspace]`：模板是独立 crate/独立 workspace。
# 复制到仓库外后不会被上层仓库的 workspace 吞掉，也便于作者单独锁定依赖。
[workspace]

[[bin]]
name = "__BIN_NAME__"
path = "src/main.rs"

[dependencies]
# 生成器会把仓库内的 `crates/plugin-sdk` 复制到 `<out>/sdk/`（自包含、独立编译），
# 因此模板只引用相对路径 `sdk`，**不依赖 dshr 仓库的绝对路径**（P1-4）。
dshr-plugin-sdk = { path = "sdk" }
# 只用于构造 panel 的 ADC-v1 元素树（serde_json::Value）。
serde_json = "=1.0.154"
