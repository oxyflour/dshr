name: cross-platform

# M4 W7/G1 的三平台前半段：契约 + 核心 crate 测试。桌面 GPUI（Windows-first）仍由
# conformance.yml 在 windows-latest 上跑完整矩阵；本 workflow 只证明契约与核心运行时
# 不依赖 Windows，并把 macOS/Linux 的构建失败暴露出来。
#
# 注意：本 workflow 尚未在 GitHub Actions 实跑；G1 在实跑绿之前不标完成。

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Schema fixtures
        run: node schema/check.mjs

      - name: Markdown links
        run: node tools/check-links.mjs

      - name: Conformance quick matrix
        run: node tools/conformance.mjs --quick --compact

  core-rust:
    name: core rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # rust-toolchain.toml 固定 1.99.1；runner 自带 rustup，会按文件安装。
      - name: Show toolchain
        run: |
          rustup show
          cargo --version
          node --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-core-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-core-cargo-

      - name: Fetch dependencies
        run: cargo fetch

      # 只测不依赖 GPUI/窗口系统的核心 crate；desktop-gpui/ui-gpui 由 desktop-build 编译。
      - name: Core Rust tests
        run: >
          cargo test --offline
          -p dshr-agent-context
          -p dshr-agent-core
          -p dshr-compat-dsh-host
          -p dshr-compat-dsh-protocol
          -p dshr-compat-mcp
          -p dshr-conversation-model
          -p dshr-llm-deepseek
          -p dshr-llm-openai
          -p dshr-llm-retry
          -p dshr-plugin-api
          -p dshr-plugin-host
          -p dshr-plugin-sdk
          -p dshr-plugin-wasm
          -p dshr-profile
          -p dshr-sandbox
          -p dshr-session-export
          -p dshr-session-store
          -p dshr-sidecar-guard
          -p dshr-tool-runtime
          -p dshr-ui-contributions

  desktop-build:
    name: desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show toolchain
        run: |
          rustup show
          cargo --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-desktop-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-cargo-

      - name: Fetch dependencies
        run: cargo fetch

      # Linux 的 GPUI 后端依赖纯 Rust/dlopen；WSL 已验证 cargo build 成功。
      - name: Build desktop chat
        run: cargo build --offline -p dshr-desktop-gpui --bin dshr

      - name: Headless CLI contracts
        run: cargo test --offline -p dshr-desktop-gpui --test headless_cli

      # Linux/macOS 运行无窗口自检：ADC 面板、恢复、真实子进程崩溃恢复。
      - name: Windows runtime selftests
        if: runner.os == 'Windows'
        run: |
          cargo build --offline -p dshr-plugin-host --bins
          target\debug\dshr.exe --selftest-adc-panel
          target\debug\dshr.exe --selftest-recovery
          target\debug\dshr.exe --selftest-crash-recovery
          target\debug\dshr.exe --selftest-window-recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target\debug\dshr.exe --selftest-window
          target\debug\dshr.exe --selftest-clipboard
          $env:DSHR_KEYBOARD_FLOW = '1'
          target\debug\dshr.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:\DSHR_KEYBOARD_FLOW

      - name: Linux/macOS runtime selftests
        if: runner.os != 'Windows'
        run: |
          cargo build --offline -p dshr-plugin-host --bins
          target/debug/dshr --selftest-adc-panel
          target/debug/dshr --selftest-recovery
          target/debug/dshr --selftest-crash-recovery

      - name: Sign Windows binary (optional)
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/sign-windows.ps1 -Path target/debug/dshr.exe -PfxPath $pfx

      - name: Sign macOS binary (optional)
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        run: bash tools/sign-macos.sh target/debug/dshr "$MACOS_SIGN_IDENTITY"

      - name: Verify diagnostic sidecar recovery (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DSHR_SIDECAR = "probe"
          $env:DSHR_HOME = Join-Path $env:RUNNER_TEMP "dshr-diagnostic-home"
          & target/debug/dshr.exe --selftest-sidecar-recovery
          exit $LASTEXITCODE

      - name: Verify diagnostic sidecar recovery (Linux/macOS)
        if: runner.os != 'Windows'
        run: DSHR_SIDECAR=probe DSHR_HOME="$RUNNER_TEMP/dshr-diagnostic-home" target/debug/dshr --selftest-sidecar-recovery

      - name: Stage locked official sidecar
        run: npm ci --ignore-scripts --prefix sidecar/dsh-official

      - name: Stage bundled Node (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: node tools/vendor-node.mjs --source (Get-Command node.exe).Source

      - name: Package desktop (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package-desktop.ps1 -Configuration debug

      - name: Package desktop (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash tools/package-desktop.sh debug

      - name: Verify desktop package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/verify-package.ps1 -Archive $zip.FullName

      - name: Verify desktop package (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash tools/verify-package.sh dist/*.tar.gz

      - name: Upload desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/debug/dshr
            target/debug/dshr.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-package-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
