name: cross-platform

# M4 W7/G1 的三平台前半段：契约 + 核心 crate 测试。桌面 GPUI（Windows-first）仍由
# conformance.yml 在 windows-latest 上跑完整矩阵；本 workflow 只证明契约与核心运行时
# 不依赖 Windows，并把 macOS/Linux 的构建失败暴露出来。
#
# 注意：本 workflow 尚未在 GitHub Actions 实跑；G1 在实跑绿之前不标完成。

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Schema fixtures
        run: node schema/check.mjs

      - name: Markdown links
        run: node tools/check-links.mjs

      - name: Conformance quick matrix
        run: node tools/conformance.mjs --quick --compact

  core-rust:
    name: core rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # rust-toolchain.toml 固定 1.99.1；runner 自带 rustup，会按文件安装。
      - name: Show toolchain
        run: |
          rustup show
          cargo --version
          node --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-core-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-core-cargo-

      - name: Fetch dependencies
        run: cargo fetch

      # 只测不依赖 GPUI/窗口系统的核心 crate；desktop-gpui/ui-gpui 由 desktop-build 编译。
      - name: Core Rust tests
        run: >
          cargo test --offline
          -p dshr-agent-context
          -p dshr-agent-core
          -p dshr-compat-dsh-host
          -p dshr-compat-dsh-protocol
          -p dshr-compat-mcp
          -p dshr-conversation-model
          -p dshr-llm-deepseek
          -p dshr-llm-openai
          -p dshr-llm-retry
          -p dshr-plugin-api
          -p dshr-plugin-host
          -p dshr-plugin-sdk
          -p dshr-plugin-wasm
          -p dshr-profile
          -p dshr-sandbox
          -p dshr-session-export
          -p dshr-session-store
          -p dshr-sidecar-guard
          -p dshr-tool-runtime
          -p dshr-ui-contributions

  desktop-build:
    name: desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show toolchain
        run: |
          rustup show
          cargo --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-desktop-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-cargo-

      - name: Fetch dependencies
        run: cargo fetch

      # Linux 的 GPUI 后端依赖纯 Rust/dlopen；WSL 已验证 cargo build 成功。
      - name: Build desktop chat
        run: cargo build --offline -p dshr-desktop-gpui --bin chat

      # Linux/macOS 运行无窗口自检：ADC 面板、恢复、真实子进程崩溃恢复。
      - name: Linux/macOS runtime selftests
        if: runner.os != 'Windows'
        run: |
          cargo build --offline -p dshr-plugin-host --bins
          target/debug/chat --selftest-adc-panel
          target/debug/chat --selftest-recovery
          target/debug/chat --selftest-crash-recovery

      - name: Package desktop (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package-desktop.ps1 -Configuration debug

      - name: Package desktop (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash tools/package-desktop.sh debug

      - name: Upload desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/debug/chat
            target/debug/chat.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-package-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
