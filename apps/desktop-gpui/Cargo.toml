[package]
name = "dshr-desktop-gpui"
description = "GPUI desktop shell entry point"
version.workspace = true
edition.workspace = true

[dependencies]
# Pinned per docs/decisions/0001-gpui-pin.md. Do not bump without a migration note.
gpui = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b", features = ["profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b" }

[dependencies.dshr-conversation-model]
path = "../../crates/conversation-model"

[dependencies.dshr-session-store]
path = "../../crates/session-store"

[dependencies.dshr-session-export]
path = "../../crates/session-export"

[dependencies.dshr-sandbox]
path = "../../crates/sandbox"

[dependencies.dshr-profile]
path = "../../crates/profile"

[dependencies.dshr-compat-dsh-host]
path = "../../crates/compat-dsh-host"

[dependencies.dshr-compat-dsh-fs]
path = "../../crates/compat-dsh-fs"

[dependencies.dshr-sidecar-guard]
path = "../../crates/sidecar-guard"

[dependencies.serde_json]
workspace = true

# M4 W1 自检需要现场生成 ed25519 键对（生产签名仍由作者侧工具完成）。
[dependencies.ring]
version = "=0.17.14"

[dependencies.dshr-agent-core]
path = "../../crates/agent-core"

[dependencies.dshr-agent-context]
path = "../../crates/agent-context"

[dependencies.dshr-ui-gpui]
path = "../../crates/ui-gpui"

[dependencies.dshr-ui-contributions]
path = "../../crates/ui-contributions"

[dependencies.dshr-llm-deepseek]
path = "../../crates/llm-deepseek"

[dependencies.dshr-llm-openai]
path = "../../crates/llm-openai"

[dependencies.dshr-llm-retry]
path = "../../crates/llm-retry"

[dependencies.dshr-plugin-api]
path = "../../crates/plugin-api"

[dependencies.dshr-plugin-host]
path = "../../crates/plugin-host"

[dependencies.dshr-tool-runtime]
path = "../../crates/tool-runtime"

# release GUI 子系统没有控制台，CLI 子命令要 AttachConsole 接回父控制台。
# 版本与 crates/sidecar-guard 保持一致（workspace 未统一锁定 windows-sys）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }
