[package]
name = "dshr-plugin-wasm"
description = "WASM 插件主机（wasmtime）：fuel/epoch/内存/输出配额与 core-module ABI（spec/cpp-v1.md §3.3/§3.5/§12）"
version = "0.1.0"
edition.workspace = true

[dependencies]
dshr-plugin-api = { path = "../plugin-api" }
dshr-tool-runtime = { path = "../tool-runtime" }
# 精确 pin；升级必须连同 conformance 一起走（ADR-008）。core-module ABI 见 lib.rs 文档。
wasmtime = { version = "=50.0.1", features = ["component-model"] }
wasmtime-wasi = "=50.0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
wit-parser = "0.261.0"
