version = "0.0.0"
edition = "2024"

# Standalone: keep it out of the dshr workspace.
[workspace]

[dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "dbb0b9a4895c4b45753ed8647cb0dbb58178bd96", features = ["gpui-fast"] }
gpui-webview = { git = "https://github.com/longbridge/gpui-kit", rev = "dbb0b9a4895c4b45753ed8647cb0dbb58178bd96", features = ["gpui-fast"] }
wry = { version = "0.53.3", package = "lb-wry" }
